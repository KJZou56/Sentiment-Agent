name: sentiment scan

on:
  schedule:
    # Hourly through the US session, Mon-Fri, in UTC.
    # 14:00-21:00 UTC covers ~09:30-16:00 ET during EDT (one hour later in EST).
    # GitHub delays scheduled runs under load — treat these as "about hourly".
    - cron: "0 14-21 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the phone app

# Only one scan at a time. Two runs pushing state to gh-pages concurrently
# would clobber each other's mention baselines.
concurrency:
  group: sentiment-scan
  cancel-in-progress: false

permissions:
  contents: write     # push the published site + state to gh-pages
  issues: write       # open an alert issue when a name clears the threshold

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Score a name must clear before it is worth interrupting you.
      NOTIFY_MIN_SCORE: "5.0"
      # Optional: set a repo secret named NTFY_TOPIC for real phone push
      # without installing anything. Left empty, that step is skipped.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore state and site from gh-pages
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            # git archive, not checkout — checkout would stage gh-pages files
            # into the working repo's index and pollute the next commit.
            git archive origin/gh-pages | tar -x -C site
            # The mention-velocity baselines live in this DB. Losing it is not
            # fatal — score.py falls back to neutral velocity and flags
            # NO_BASELINE — but the scores are sharper when it survives.
            [ -f site/agent_state.db ] && cp site/agent_state.db agent_state.db || true
            echo "restored $( [ -f agent_state.db ] && echo 'with' || echo 'without' ) prior state"
          else
            echo "no gh-pages branch yet — first run, starting cold"
          fi

      - name: Configure
        run: |
          cp config.example.yaml config.yaml
          python - <<'PY'
          import yaml, pathlib
          p = pathlib.Path("config.yaml")
          c = yaml.safe_load(p.read_text())
          # Reddit blocks generic user agents; identify the bot properly.
          c["sources"]["reddit"]["user_agent"] = (
              "sentiment-agent/1.0 (github actions; personal research)")
          c["watch"]["market_hours_only"] = False   # the cron already gates this
          p.write_text(yaml.safe_dump(c, sort_keys=False))
          PY

      - name: Scan
        run: python run.py scan
        env:
          PYTHONUNBUFFERED: "1"

      - name: Grade past calls
        continue-on-error: true
        run: python run.py review --after-hours 24

      - name: Publish
        run: |
          python ci/publish.py --reports ./reports --site ./site
          cp agent_state.db site/agent_state.db 2>/dev/null || true
          touch site/.nojekyll

      - name: Job summary
        if: always()
        run: |
          echo "## Latest scan" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = sorted(pathlib.Path("reports").glob("scan-*.json"))
          if not f:
              print("_No scan output._"); raise SystemExit
          d = json.loads(f[-1].read_text())
          rows = []
          for bucket in ("long", "short", "crowded", "conflict"):
              for r in d["buckets"].get(bucket, []):
                  m = r.get("market", {})
                  flags = ", ".join(x for x in r["flags"] if x != "NO_BASELINE")
                  rows.append(f"| {r['ticker']} | {r['score']:+.1f} | {r['label']} "
                              f"| {m.get('ret_1d',0):+.1f}% | {flags or '—'} |")
          if rows:
              print("| Ticker | Score | Label | 1d | Flags |")
              print("|---|---:|---|---:|---|")
              print("\n".join(rows))
          else:
              print("_Nothing cleared the threshold. Most scans look like this._")
          PY

      - name: Deploy to gh-pages
        run: |
          cd site
          git init -q
          git config user.name "sentiment-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "scan $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - name: Alert on new signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notify=$(python -c "import json;print(json.load(open('signal.json')).get('notify',False))")
          if [ "$notify" != "True" ]; then
            echo "No new signal — staying quiet."
            exit 0
          fi
          title=$(python -c "import json;print(json.load(open('signal.json'))['title'])")
          python -c "import json;open('body.md','w').write(json.load(open('signal.json'))['body'])"
          gh issue create --title "$title" --body-file body.md --label signal \
            || gh issue create --title "$title" --body-file body.md

      - name: Push notification (optional)
        if: env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          notify=$(python -c "import json;print(json.load(open('signal.json')).get('notify',False))")
          [ "$notify" = "True" ] || exit 0
          title=$(python -c "import json;print(json.load(open('signal.json'))['title'])")
          curl -s -H "Title: $title" -H "Tags: chart_with_upwards_trend" \
            -d "New sentiment signal. Open the report for the reasoning." \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null
